### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields:
      - after.id
      - after.iupd
      - after.fiscal_code
      - after.postal_code
      - after.province
      - after.max_due_date
      - after.min_due_date
      - after.organization_fiscal_code
      - after.company_name
      - after.publish_date
      - after.region
      - after.status
      - after.type
      - after.validity_date
      - after.switch_to_expired
      - after.payment_date
      - after.last_updated_date
      - after.inserted_date
      - after.service_type
      - op
      - ts_ms
      - ts_us
      - ts_ns
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_position
  specification: |-
    checks for payment-position:
      - row_count > 0
      - missing_count(op) = 0
      - missing_count(ts_ms) = 0
      - missing_count(ts_ns) = 0
      - missing_count(ts_us) = 0
      - freshness(dl_event_tms) < 1d:
          name: Data is fresh
      - count_before_delete = 0:
          name: Validazione before per le operazioni di delete
          count_before_delete query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE
              (op = 'd' AND before.id IS NULL)
              OR
              (op = 'd' AND (
                    before.iupd != ''
                    OR before.fiscal_code != ''
                    OR before.max_due_date != 0
                    OR before.min_due_date != 0
                    OR before.organization_fiscal_code != ''
                    OR before.company_name != ''
                    OR before.type != ''
                    OR before.switch_to_expired != false
                    OR before.last_updated_date != 0
                    OR before.inserted_date != 0
            ))
      - count_create_read_update_null = 0:
          name: Validazione after per operazioni di create, read, and update
          count_create_read_update_null query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u') AND after.id IS NULL
