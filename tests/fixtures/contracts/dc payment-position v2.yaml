### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields:
      - after.id
      - after.iupd
      - after.fiscal_code
      - after.postal_code
      - after.province
      - after.max_due_date
      - after.min_due_date
      - after.organization_fiscal_code
      - after.company_name
      - after.publish_date
      - after.region
      - after.status
      - after.type
      - after.validity_date
      - after.switch_to_expired
      - after.payment_date
      - after.last_updated_date
      - after.inserted_date
      - after.service_type
      - op
      - ts_ms
      - ts_us
      - ts_ns
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_position
  specification: |-
    checks for payment-position:
      
      # ============================================================
      # Controlli Base / Entity Level
      # ============================================================
      - row_count > 0:
          name: ent__cmp__dataset__not_empty
      
      - missing_count(op) = 0:
          name: fld__cmp__op__not_null
      - missing_count(ts_ms) = 0:
          name: fld__cmp__ts_ms__not_null
      - missing_count(ts_ns) = 0:
          name: fld__cmp__ts_ns__not_null
      - missing_count(ts_us) = 0:
          name: fld__cmp__ts_us__not_null
          
      - freshness(dl_event_tms) < 1d:
          name: fld__tim__dl_event_tms__within_1d

      # ============================================================
      # Controlli Custom di Coerenza Intra-Entity (ent__cns)
      # ============================================================
      - count_before_delete = 0:
          name: ent__cns__delete_event__before_fields_cleared
          count_before_delete query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE
              (op = 'd' AND before.id IS NULL)
              OR
              (op = 'd' AND (
                    before.iupd != ''
                    OR before.fiscal_code != ''
                    OR before.max_due_date != 0
                    OR before.min_due_date != 0
                    OR before.organization_fiscal_code != ''
                    OR before.company_name != ''
                    OR before.type != ''
                    OR before.switch_to_expired != false
                    OR before.last_updated_date != 0
                    OR before.inserted_date != 0
            ))
            
      - count_create_read_update_null = 0:
          name: ent__cns__upsert_event__after_id_not_null
          count_create_read_update_null query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u') AND after.id IS NULL

      - unix_timestamp_microseconds_length_payment_date = 0:
          name: fld__vld__payment_date__ts_length_min_16
          unix_timestamp_microseconds_length_payment_date query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u') AND after.payment_date IS NOT NULL AND LENGTH(CAST(after.payment_date AS STRING)) < 16
      
      # ============================================================
      # Check Completezza: Not Null (Filtrati per escludere Delete)
      # ============================================================
      - missing_count(after.id) = 0:
          name: fld__cmp__id__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.fiscal_code) = 0:
          name: fld__cmp__fiscal_code__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.min_due_date) = 0:
          name: fld__cmp__min_due_date__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.max_due_date) = 0:
          name: fld__cmp__max_due_date__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.organization_fiscal_code) = 0:
          name: fld__cmp__organization_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.company_name) = 0:
          name: fld__cmp__company_name__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.status) = 0:
          name: fld__cmp__status__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.type) = 0:
          name: fld__cmp__type__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.switch_to_expired) = 0:
          name: fld__cmp__switch_to_expired__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.last_updated_date) = 0:
          name: fld__cmp__last_updated_date__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.inserted_date) = 0:
          name: fld__cmp__inserted_date__not_null
          filter: op IN ('c', 'r', 'u')

      # ============================================================
      # Check Validità: Pattern P.IVA / Codice Fiscale
      # ============================================================
      - invalid_count(after.organization_fiscal_code) = 0:
          name: fld__vld__organization_fiscal_code__cf_piva_pattern
          filter: op IN ('c', 'r', 'u')
          valid regex: '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$'

      # ============================================================
      # Check Validità: Campi Enum
      # ============================================================
      - invalid_count(after.status) = 0:
          name: fld__vld__status__enum
          filter: op IN ('c', 'r', 'u')
          valid values: ['DRAFT', 'PUBLISHED', 'VALID', 'PAID', 'EXPIRED', 'INVALID', 'REPORTED', 'PARTIALLY_PAID']
      
      - invalid_count(after.type) = 0:
          name: fld__vld__type__enum
          filter: op IN ('c', 'r', 'u')
          valid values: ['F', 'G']
      
      - invalid_count(after.service_type) = 0:
          name: fld__vld__service_type__enum
          filter: op IN ('c', 'r', 'u')
          valid values: ['GPD', 'ACA', 'WISP']

      # ============================================================
      # Check Validità: Lunghezza Timestamp (Massimo 16 cifre)
      # ============================================================
      - count_invalid_max_due_date_length = 0:
          name: fld__vld__max_due_date__ts_max_length_16
          count_invalid_max_due_date_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.max_due_date IS NOT NULL
              AND LENGTH(CAST(after.max_due_date AS STRING)) > 16
              
      - count_invalid_min_due_date_length = 0:
          name: fld__vld__min_due_date__ts_max_length_16
          count_invalid_min_due_date_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.min_due_date IS NOT NULL
              AND LENGTH(CAST(after.min_due_date AS STRING)) > 16
              
      - count_invalid_publish_date_length = 0:
          name: fld__vld__publish_date__ts_max_length_16
          count_invalid_publish_date_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.publish_date IS NOT NULL
              AND LENGTH(CAST(after.publish_date AS STRING)) > 16
              
      - count_invalid_validity_date_length = 0:
          name: fld__vld__validity_date__ts_max_length_16
          count_invalid_validity_date_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.validity_date IS NOT NULL
              AND LENGTH(CAST(after.validity_date AS STRING)) > 16
              
      - count_invalid_last_updated_date_length = 0:
          name: fld__vld__last_updated_date__ts_max_length_16
          count_invalid_last_updated_date_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.last_updated_date IS NOT NULL
              AND LENGTH(CAST(after.last_updated_date AS STRING)) > 16

      # ============================================================
      # Check Validità: Intervallo Date (Data max <= now() + 30 anni)
      # ============================================================
      - count_max_due_date_over_30y = 0:
          name: fld__vld__max_due_date__date_max_30y
          count_max_due_date_over_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.max_due_date IS NOT NULL
              AND from_unixtime(after.max_due_date / 1000000) > add_months(current_timestamp(), 360)
              
      - count_min_due_date_over_30y = 0:
          name: fld__vld__min_due_date__date_max_30y
          count_min_due_date_over_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.min_due_date IS NOT NULL
              AND from_unixtime(after.min_due_date / 1000000) > add_months(current_timestamp(), 360)
              
      - count_validity_date_over_30y = 0:
          name: fld__vld__validity_date__date_max_30y
          count_validity_date_over_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.validity_date IS NOT NULL
              AND from_unixtime(after.validity_date / 1000000) > add_months(current_timestamp(), 360)


      # ============================================================
      # Check aggiunti il 2026-05-13 da data-contract-quality-builder
      # Fonte: GPD - Controlli Intra-entità + Cross-entità (XLSX)
      # ============================================================

      # ------------------------------------------------------------
      # Controlli Intra-Entity: Chiave Univoca (ent__unq)
      # ------------------------------------------------------------
      - count_duplicate_iupd_org = 0:
          name: ent__unq__iupd_org_fiscal_code__no_duplicates
          count_duplicate_iupd_org query: |
            SELECT COUNT(*) FROM (
              SELECT after.iupd, after.organization_fiscal_code, COUNT(*) AS cnt
              FROM pagopa.silver_gpd_payment_position
              WHERE op IN ('c', 'r', 'u')
                AND after.iupd IS NOT NULL
                AND after.organization_fiscal_code IS NOT NULL
              GROUP BY after.iupd, after.organization_fiscal_code
              HAVING COUNT(*) > 1
            ) t

      # ------------------------------------------------------------
      # Controlli Intra-Entity: Valorizzazione Condizionale (ent__cns)
      # ------------------------------------------------------------
      # Se after.payment_date è valorizzato, after.status deve essere in {PAID, REPORTED, PARTIALLY_PAID}
      - count_payment_date_status_inconsistent = 0:
          name: ent__cns__paid_status_when_payment_date__conditional_value
          count_payment_date_status_inconsistent query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.payment_date IS NOT NULL
              AND after.status NOT IN ('PAID', 'REPORTED', 'PARTIALLY_PAID')

      # Se after.publish_date è NULL, after.status deve essere = DRAFT
      - count_publish_date_null_status_not_draft = 0:
          name: ent__cns__draft_status_without_publish_date__conditional_value
          count_publish_date_null_status_not_draft query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.publish_date IS NULL
              AND after.status <> 'DRAFT'

      # Se after.switch_to_expired = TRUE, after.max_due_date non deve essere superiore a now()
      - count_switch_to_expired_future_due = 0:
          name: ent__cns__switch_to_expired_implies_past_due_date__conditional_value
          count_switch_to_expired_future_due query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.switch_to_expired = TRUE
              AND after.max_due_date IS NOT NULL
              AND from_unixtime(after.max_due_date / 1000000) > current_timestamp()

      # ------------------------------------------------------------
      # Controlli Intra-Entity: Presenza Condizionale (ent__cns)
      # ------------------------------------------------------------
      # NB: parzialmente coperto da ent__cns__upsert_event__after_id_not_null;
      # questo check verifica la presenza strutturale completa della struct after.
      - count_after_missing_on_upsert = 0:
          name: ent__cns__after_present_on_upsert__conditional_presence
          count_after_missing_on_upsert query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after IS NULL

      # Per op = 'd', la struct before deve essere presente
      - count_before_missing_on_delete = 0:
          name: ent__cns__before_present_on_delete__conditional_presence
          count_before_missing_on_delete query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op = 'd'
              AND before IS NULL

      # ------------------------------------------------------------
      # Controlli Intra-Entity: Validità CF/PIVA Creditore-Debitore (ent__vld)
      # ------------------------------------------------------------
      # WARNING: after.fiscal_code è tokenizzato in silver (pii=true, esempio UUID).
      # Il check fallirà sistematicamente in silver: valutare se applicarlo su layer
      # bronze pre-tokenizzazione oppure disabilitare con # DISABLED.
      - count_invalid_creditor_debtor_cf = 0:
          name: ent__vld__creditor_debtor_fiscal_codes__cf_piva_format
          count_invalid_creditor_debtor_cf query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND (
                (after.fiscal_code IS NOT NULL
                  AND after.fiscal_code NOT RLIKE '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$')
                OR
                (after.organization_fiscal_code IS NOT NULL
                  AND after.organization_fiscal_code NOT RLIKE '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$')
              )

      # ============================================================
      # Controlli Cross-Entity (xref) — JOIN con pagopa.silver_gpd_payment_option
      # ============================================================
      # Integrità referenziale: ogni payment_option.payment_position_id deve trovare
      # corrispondenza in silver_gpd_payment_position.after.id
      - count_orphan_payment_options = 0:
          name: xref__cns__payment_option__referential_integrity
          count_orphan_payment_options query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option po
            WHERE po.op IN ('c', 'r', 'u')
              AND po.after.payment_position_id IS NOT NULL
              AND NOT EXISTS (
                SELECT 1
                FROM pagopa.silver_gpd_payment_position pp
                WHERE pp.op IN ('c', 'r', 'u')
                  AND pp.after.id = po.after.payment_position_id
              )

      # Coerenza CF/PIVA cross: payment_position.after.fiscal_code (debitore) e
      # payment_option.after.organization_fiscal_code (creditore)
      # WARNING: vale lo stesso caveat del check ent__vld__creditor_debtor_fiscal_codes
      # (fiscal_code tokenizzato in silver).
      - count_invalid_cross_fiscal_codes = 0:
          name: xref__cns__payment_option__cf_piva_format
          count_invalid_cross_fiscal_codes query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position pp
            JOIN pagopa.silver_gpd_payment_option po
              ON pp.after.id = po.after.payment_position_id
            WHERE pp.op IN ('c', 'r', 'u')
              AND po.op IN ('c', 'r', 'u')
              AND (
                (pp.after.fiscal_code IS NOT NULL
                  AND pp.after.fiscal_code NOT RLIKE '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$')
                OR
                (po.after.organization_fiscal_code IS NOT NULL
                  AND po.after.organization_fiscal_code NOT RLIKE '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$')
              )

      # Coerenza cronologica cross: payment_option.due_date non può essere superiore
      # a payment_position.max_due_date corrispondente
      - count_option_due_date_exceeds_position_max = 0:
          name: xref__cns__payment_option__due_date_consistency
          count_option_due_date_exceeds_position_max query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position pp
            JOIN pagopa.silver_gpd_payment_option po
              ON pp.after.id = po.after.payment_position_id
            WHERE pp.op IN ('c', 'r', 'u')
              AND po.op IN ('c', 'r', 'u')
              AND pp.after.max_due_date IS NOT NULL
              AND po.after.due_date IS NOT NULL
              AND po.after.due_date > pp.after.max_due_date
