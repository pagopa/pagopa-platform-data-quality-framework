### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields:
      - after.id
      - after.iupd
      - after.fiscal_code
      - after.postal_code
      - after.province
      - after.max_due_date
      - after.min_due_date
      - after.organization_fiscal_code
      - after.company_name
      - after.publish_date
      - after.region
      - after.status
      - after.type
      - after.validity_date
      - after.switch_to_expired
      - after.payment_date
      - after.last_updated_date
      - after.inserted_date
      - after.service_type
      - op
      - ts_ms
      - ts_us
      - ts_ns
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_position
  xref-dataset:
    - silver_gpd_payment_option
  specification: |-
    checks for payment-position:

      # ============================================================
      # Entity Level -- massivo
      # ============================================================
      - row_count > 0:
          name: ent__cmp__dataset__is_not_empty

      # ============================================================
      # Completezza (fld__cmp) -- incrementale
      # ============================================================
      - missing_count(after.id) = 0:
          name: fld__cmp__id__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.fiscal_code) = 0:
          name: fld__cmp__fiscal_code__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.min_due_date) = 0:
          name: fld__cmp__min_due_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.max_due_date) = 0:
          name: fld__cmp__max_due_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.organization_fiscal_code) = 0:
          name: fld__cmp__organization_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.company_name) = 0:
          name: fld__cmp__company_name__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.status) = 0:
          name: fld__cmp__status__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.type) = 0:
          name: fld__cmp__type__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.switch_to_expired) = 0:
          name: fld__cmp__switch_to_expired__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      # Name Excel ha refuso "last_update_date"; colonna DDL reale: after.last_updated_date (Name usato as-is)
      - missing_count(after.last_updated_date) = 0:
          name: fld__cmp__last_update_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.inserted_date) = 0:
          name: fld__cmp__inserted_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      # Completezza envelope CDC (campi root) -- preesistenti, normalizzati
      - missing_count(op) = 0:
          name: fld__cmp__op__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ms) = 0:
          name: fld__cmp__ts_ms__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_us) = 0:
          name: fld__cmp__ts_us__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ns) = 0:
          name: fld__cmp__ts_ns__not_null
          filter: ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Freschezza (fld__tim) -- massivo
      # ============================================================
      - freshness(dl_event_tms) < 1d:
          name: fld__tim__dl_event_tms__freshness_1d

      # ============================================================
      # Validita' (fld__vld) -- incrementale salvo nota
      # ============================================================
      # organization_fiscal_code = Ente Creditore -> P.IVA 11 cifre
      - invalid_count(after.organization_fiscal_code) = 0:
          name: fld__vld__organization_fiscal_code__vat_format
          valid regex: '^[0-9]{11}$'
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.status) = 0:
          name: fld__vld__status__enum
          valid values: ['DRAFT', 'PUBLISHED', 'VALID', 'PAID', 'EXPIRED', 'INVALID', 'REPORTED', 'PARTIALLY_PAID']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.type) = 0:
          name: fld__vld__type__enum
          valid values: ['F', 'G']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.service_type) = 0:
          name: fld__vld__service_type__enum
          valid values: ['GPD', 'ACA', 'WISP']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      # Lunghezza MAX 16 cifre del timestamp in microsecondi (> 16 = violazione)
      - fld__vld__max_due_date__timestamp_length = 0:
          fld__vld__max_due_date__timestamp_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND LENGTH(CAST(after.max_due_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.max_due_date
          name: fld__vld__max_due_date__timestamp_length
      - fld__vld__max_due_date__date_max_30y = 0:
          fld__vld__max_due_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.max_due_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.max_due_date, from_unixtime(after.max_due_date / 1000000) AS max_due_date_ts
          name: fld__vld__max_due_date__date_max_30y
      - fld__vld__min_due_date__timestamp_length = 0:
          fld__vld__min_due_date__timestamp_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND LENGTH(CAST(after.min_due_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.min_due_date
          name: fld__vld__min_due_date__timestamp_length
      - fld__vld__min_due_date__date_max_30y = 0:
          fld__vld__min_due_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.min_due_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.min_due_date, from_unixtime(after.min_due_date / 1000000) AS min_due_date_ts
          name: fld__vld__min_due_date__date_max_30y
      # Name Excel ha refuso "min_publish_date"; colonna DDL reale: after.publish_date (Name usato as-is). Campo nullable.
      - fld__vld__min_publish_date__timestamp_length = 0:
          fld__vld__min_publish_date__timestamp_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.publish_date IS NOT NULL
              AND LENGTH(CAST(after.publish_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.publish_date
          name: fld__vld__min_publish_date__timestamp_length
      - fld__vld__validity_date__timestamp_length = 0:
          fld__vld__validity_date__timestamp_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.validity_date IS NOT NULL
              AND LENGTH(CAST(after.validity_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.validity_date
          name: fld__vld__validity_date__timestamp_length
      - fld__vld__validity_date__date_max_30y = 0:
          fld__vld__validity_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.validity_date IS NOT NULL
              AND after.validity_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.validity_date, from_unixtime(after.validity_date / 1000000) AS validity_date_ts
          name: fld__vld__validity_date__date_max_30y
      # Name Excel ha refuso "last_update_date"; colonna DDL reale: after.last_updated_date (Name usato as-is)
      - fld__vld__last_update_date__timestamp_length = 0:
          fld__vld__last_update_date__timestamp_length query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND LENGTH(CAST(after.last_updated_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.last_updated_date
          name: fld__vld__last_update_date__timestamp_length
      # Preesistente (attivo): lunghezza MIN 16 cifre su payment_date (< 16 = violazione)
      - fld__vld__payment_date__digit_length_min_16 = 0:
          fld__vld__payment_date__digit_length_min_16 query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.payment_date IS NOT NULL
              AND LENGTH(CAST(after.payment_date AS STRING)) < 16
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.payment_date
          name: fld__vld__payment_date__digit_length_min_16

      # ============================================================
      # Consistenza Intra-entity (ent) -- incrementale salvo unicita'
      # ============================================================
      # Unicita' chiave di business (iupd + organization_fiscal_code) -- massivo
      - ent__unq__iupd_org_fiscal_code__no_duplicates = 0:
          ent__unq__iupd_org_fiscal_code__no_duplicates query: |
            SELECT COUNT(*)
            FROM (
              SELECT after.iupd, after.organization_fiscal_code, COUNT(*) AS cnt
              FROM pagopa.silver_gpd_payment_position
              WHERE op IN ('c', 'r', 'u')
                AND after.iupd IS NOT NULL
                AND after.organization_fiscal_code IS NOT NULL
              GROUP BY after.iupd, after.organization_fiscal_code
              HAVING COUNT(*) > 1
            ) AS sub
          failed-query-fields: sub.iupd, sub.organization_fiscal_code, sub.cnt
          name: ent__unq__iupd_org_fiscal_code__no_duplicates
      # Se payment_date valorizzato allora status IN (PAID, REPORTED, PARTIALLY_PAID)
      - ent__cns__payment_date_status__conditional_value = 0:
          ent__cns__payment_date_status__conditional_value query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.payment_date IS NOT NULL
              AND after.status NOT IN ('PAID', 'REPORTED', 'PARTIALLY_PAID')
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.payment_date, after.status
          name: ent__cns__payment_date_status__conditional_value
      # Se publish_date NON valorizzato allora status puo' essere solo DRAFT
      - ent__cns__publish_date_status__conditional_value = 0:
          ent__cns__publish_date_status__conditional_value query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.publish_date IS NULL
              AND after.status != 'DRAFT'
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.publish_date, after.status
          name: ent__cns__publish_date_status__conditional_value
      # Se switch_to_expired = TRUE allora max_due_date non puo' essere oltre now()
      - ent__cns__switch_to_expired_max_due_date__conditional_value = 0:
          ent__cns__switch_to_expired_max_due_date__conditional_value query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.switch_to_expired = TRUE
              AND after.max_due_date > unix_micros(current_timestamp())
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.switch_to_expired, after.max_due_date, from_unixtime(after.max_due_date / 1000000) AS max_due_date_ts
          name: ent__cns__switch_to_expired_max_due_date__conditional_value
      # Presenza struct after: presente su c/r/u, assente su d
      - ent__cmp__after_struct__conditional_presence = 0:
          ent__cmp__after_struct__conditional_presence query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE (
                (op IN ('c', 'r', 'u') AND after IS NULL)
                OR (op = 'd' AND after IS NOT NULL)
              )
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, op, after.id, after.iupd, before.id, before.iupd
          name: ent__cmp__after_struct__conditional_presence
      # Presenza struct before: presente su d, assente su c/r/u
      - ent__cmp__before_struct__conditional_presence = 0:
          ent__cmp__before_struct__conditional_presence query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE (
                (op = 'd' AND before IS NULL)
                OR (op IN ('c', 'r', 'u') AND before IS NOT NULL)
              )
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, op, after.id, after.iupd, before.id, before.iupd
          name: ent__cmp__before_struct__conditional_presence
      # Coerenza envelope delete: su op='d' la struct before deve avere solo id valorizzato
      # (preesistente count_before_delete, normalizzato)
      - ent__cns__delete_event__before_fields_cleared = 0:
          ent__cns__delete_event__before_fields_cleared query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op = 'd'
              AND (
                    before.id IS NULL
                    OR before.iupd != ''
                    OR before.fiscal_code != ''
                    OR before.max_due_date != 0
                    OR before.min_due_date != 0
                    OR before.organization_fiscal_code != ''
                    OR before.company_name != ''
                    OR before.type != ''
                    OR before.switch_to_expired != false
                    OR before.last_updated_date != 0
                    OR before.inserted_date != 0
              )
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, op, before.id, before.iupd, before.fiscal_code, before.organization_fiscal_code
          name: ent__cns__delete_event__before_fields_cleared
      # WARNING: after.fiscal_code e' tokenizzato in silver (pii=true, UUID); il confronto
      # fiscal_code = organization_fiscal_code non trovera' match in silver. Valutare layer bronze.
      - ent__cns__fiscal_code__creditor_debtor_coherence = 0:
          ent__cns__fiscal_code__creditor_debtor_coherence query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.fiscal_code = after.organization_fiscal_code
              AND ${INCREMENTAL_CONDITIONS}
          failed-query-fields: dl_id, after.iupd, after.id, after.fiscal_code, after.organization_fiscal_code
          name: ent__cns__fiscal_code__creditor_debtor_coherence

      # ============================================================
      # Cross-entity (xref) -- incrementale (driving = tabella del delta)
      # ============================================================
      # Integrita' referenziale: ogni payment_option deve avere una payment_position padre
      # (driving = payment_option spo)
      - xref__cns__payment_position__referential_integrity = 0:
          xref__cns__payment_position__referential_integrity query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option spo
            LEFT JOIN pagopa.silver_gpd_payment_position spp
              ON spp.op IN ('c', 'r', 'u')
              AND spp.after.id = spo.after.payment_position_id
            WHERE spo.op IN ('c', 'r', 'u')
              AND spp.dl_id IS NULL
              AND ${INCREMENTAL_CONDITIONS:spo}
          failed-query-fields: spo.dl_id, spo.after.iuv, spo.after.organization_fiscal_code, spo.after.payment_position_id
          name: xref__cns__payment_position__referential_integrity
      # Coerenza CF creditore/debitore tra payment_position e payment_option (driving = spp)
      # WARNING: after.fiscal_code tokenizzato in silver (pii=true): possibili falsi negativi. Valutare bronze.
      - xref__cns__payment_option__fiscal_code_coherence = 0:
          xref__cns__payment_option__fiscal_code_coherence query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position spp
            JOIN pagopa.silver_gpd_payment_option spo
              ON spo.after.payment_position_id = spp.after.id
            WHERE spp.op IN ('c', 'r', 'u')
              AND spo.op IN ('c', 'r', 'u')
              AND spp.after.fiscal_code = spo.after.organization_fiscal_code
              AND ${INCREMENTAL_CONDITIONS:spp}
          failed-query-fields: spp.dl_id, spp.after.iupd, spp.after.fiscal_code, spo.after.organization_fiscal_code
          name: xref__cns__payment_option__fiscal_code_coherence
      # Coerenza cronologica: payment_option.due_date non oltre payment_position.max_due_date
      # (driving = payment_option spo, righe che generano la violazione)
      - xref__cns__due_dates__temporal_sequence = 0:
          xref__cns__due_dates__temporal_sequence query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option spo
            JOIN pagopa.silver_gpd_payment_position spp
              ON spp.after.id = spo.after.payment_position_id
            WHERE spo.op IN ('c', 'r', 'u')
              AND spp.op IN ('c', 'r', 'u')
              AND spo.after.due_date IS NOT NULL
              AND spo.after.due_date > spp.after.max_due_date
              AND ${INCREMENTAL_CONDITIONS:spo}
          failed-query-fields: spo.dl_id, spo.after.iuv, spo.after.organization_fiscal_code, spo.after.due_date, spp.after.max_due_date
          name: xref__cns__due_dates__temporal_sequence

