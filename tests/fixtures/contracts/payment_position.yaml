### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields:
      - after.id
      - after.iupd
      - after.fiscal_code
      - after.postal_code
      - after.province
      - after.max_due_date
      - after.min_due_date
      - after.organization_fiscal_code
      - after.company_name
      - after.publish_date
      - after.region
      - after.status
      - after.type
      - after.validity_date
      - after.switch_to_expired
      - after.payment_date
      - after.last_updated_date
      - after.inserted_date
      - after.service_type
      - op
      - ts_ms
      - ts_us
      - ts_ns
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_position
  xref-dataset:
    - silver_gpd_payment_option
  specification: |-
    checks for payment-position:

      # ============================================================
      # Entity Level (massivo)
      # ============================================================
      - row_count > 0:
          name: ent__cmp__dataset__is_not_empty

      # ============================================================
      # Completezza Campi Root -- nativi, incrementali
      # ============================================================
      - missing_count(op) = 0:
          name: fld__cmp__op__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ms) = 0:
          name: fld__cmp__ts_ms__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ns) = 0:
          name: fld__cmp__ts_ns__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_us) = 0:
          name: fld__cmp__ts_us__not_null
          filter: ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Freschezza
      # ============================================================
      - freshness(dl_event_tms) < 1d:
          name: fld__tim__dl_event_tms__freshness_1d

      # ============================================================
      # Completezza Campi After (op IN 'c', 'r', 'u') -- nativi, incrementali
      # ============================================================
      - missing_count(after.id) = 0:
          name: fld__cmp__after_id__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.fiscal_code) = 0:
          name: fld__cmp__after_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.min_due_date) = 0:
          name: fld__cmp__after_min_due_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.max_due_date) = 0:
          name: fld__cmp__after_max_due_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.organization_fiscal_code) = 0:
          name: fld__cmp__after_organization_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.company_name) = 0:
          name: fld__cmp__after_company_name__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.status) = 0:
          name: fld__cmp__after_status__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.type) = 0:
          name: fld__cmp__after_type__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.switch_to_expired) = 0:
          name: fld__cmp__after_switch_to_expired__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.last_updated_date) = 0:
          name: fld__cmp__after_last_updated_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.inserted_date) = 0:
          name: fld__cmp__after_inserted_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Enum -- nativi, incrementali
      # ============================================================
      - invalid_count(after.status) = 0:
          name: fld__vld__after_status__enum
          valid values: ['DRAFT', 'PUBLISHED', 'VALID', 'PAID', 'EXPIRED', 'INVALID', 'REPORTED', 'PARTIALLY_PAID']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.type) = 0:
          name: fld__vld__after_type__enum
          valid values: ['F', 'G']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.service_type) = 0:
          name: fld__vld__after_service_type__enum
          valid values: ['GPD', 'ACA', 'WISP']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Lunghezza Timestamp
      # ============================================================
      - invalid_count(after.max_due_date) = 0:
          name: fld__vld__max_due_date__timestamp_length
          valid min: -999999999999999
          valid max: 9999999999999999
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.min_due_date) = 0:
          name: fld__vld__min_due_date__timestamp_length
          valid min: -999999999999999
          valid max: 9999999999999999
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.validity_date) = 0:
          name: fld__vld__validity_date__timestamp_length
          valid min: -999999999999999
          valid max: 9999999999999999
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.last_updated_date) = 0:
          name: fld__vld__last_update_date__timestamp_length
          valid min: -999999999999999
          valid max: 9999999999999999
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - invalid_count(after.payment_date) = 0:
          name: fld__vld__payment_date__timestamp_length
          valid min: -999999999999999
          valid max: 9999999999999999
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Intervallo Date <= now() + 30y (fld__vld) -- incrementali
      # ============================================================
      - fld__vld__max_due_date__date_max_30y = 0:
          fld__vld__max_due_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.max_due_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed query fields: dl_id, after.iupd, after.id, after.max_due_date, from_unixtime(after.max_due_date / 1000000) AS max_due_date_ts
          name: fld__vld__max_due_date__date_max_30y

      - fld__vld__min_due_date__date_max_30y = 0:
          fld__vld__min_due_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.min_due_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed query fields: dl_id, after.iupd, after.id, after.min_due_date, from_unixtime(after.min_due_date / 1000000) AS min_due_date_ts
          name: fld__vld__min_due_date__date_max_30y

      - fld__vld__validity_date__date_max_30y = 0:
          fld__vld__validity_date__date_max_30y query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op IN ('c', 'r', 'u')
              AND after.validity_date > unix_micros(CAST(add_months(current_date(), 360) AS TIMESTAMP))
              AND ${INCREMENTAL_CONDITIONS}
          failed query fields: dl_id, after.iupd, after.id, after.validity_date, from_unixtime(after.validity_date / 1000000) AS validity_date_ts
          name: fld__vld__validity_date__date_max_30y

      # ============================================================
      # Consistenza Intra-Entity (ent__cns / ent__cmp) -- incrementali
      # ============================================================
      - ent__cns__delete_event__before_fields_cleared = 0:
          ent__cns__delete_event__before_fields_cleared query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_position
            WHERE op = 'd'
              AND (
                    before.id IS NULL
                    OR before.iupd != ''
                    OR before.fiscal_code != ''
                    OR before.max_due_date != 0
                    OR before.min_due_date != 0
                    OR before.organization_fiscal_code != ''
                    OR before.company_name != ''
                    OR before.type != ''
                    OR before.switch_to_expired != false
                    OR before.last_updated_date != 0
                    OR before.inserted_date != 0
              )
              AND ${INCREMENTAL_CONDITIONS}
          failed query fields: dl_id, op, before.id, before.iupd, before.fiscal_code, before.organization_fiscal_code, before.company_name, before.type, before.switch_to_expired
          name: ent__cns__delete_event__before_fields_cleared

      - ent__cmp__after_struct__conditional_presence = 0:
