            description: Data ultima modifica delle spese di notifica (SEND)
            example: "1734250095385581"
            pii: false            
      before:
        type: record
        required: false
        description: Sezione che contiente il contenuto dei campi a valle di un'operazione di delete
        fields:
          id:
            title: ID Evento
            type: int
            required: true
            description: Identificativo univoco evento
            example: "16"
            pii: false
          payment_position_id:
            title: FK posizione debitoria
            type: int
            required: true
            description: FK tabella payment_position (on iupd)
            example: "0"
            pii: false
          amount:
            title: Importo
            type: long
            required: true
            description: Importo opzione di pagamento in euro cents
            example: "0"
            pii: false
          description:
            title: Descrizione
            type: string
            required: false
            description: Causale opzione di pagamento
            example: ""
            pii: false
          due_date:
            title: Data scadenza
            type: long
            required: false
            description: Data scadenza opzione di pagamento
            example: "0"
            pii: false
          fee:
            title: Commissione
            type: int
            required: false
            description: Commissione applicata in fase di pagamento
            example: "0"
            pii: false
          inserted_date:
            title: Data inserimento
            type: long
            required: true
            description: Data inserimento opzione di pagamento
            example: "0"
            pii: false
          is_partial_payment:
            title: Pagamento parziale
            type: boolean
            required: true
            description: Indica se il pagamento è parziale (rata o soluzione unica)
            example: "false"
            pii: false
          iuv:
            title: IUV
            type: string
            required: true
            description: Identificativo univoco opzione di pagamento
            example: ""
            pii: false
          organization_fiscal_code:
            title: Codice fiscale EC
            type: string
            required: true
            description: Codice fiscale ente creditore primario
            example: ""
            pii: false
          notification_fee:
