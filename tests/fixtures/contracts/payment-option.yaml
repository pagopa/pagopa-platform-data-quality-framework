### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields: 
      - after.id
      - after.payment_position_id
      - after.amount
      - after.description
      - after.due_date
      - after.fee
      - after.inserted_date
      - after.is_partial_payment
      - after.iuv
      - after.organization_fiscal_code
      - after.retention_date
      - after.notification_fee
      - last_updated_date_notification_fee
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id



### Controlli impala
### Controlli impala

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_option
  specification: |-
    checks for payment-option:
      - row_count > 0:
        name: row_count_massimo
      - missing_count(op) = 0
      - missing_count(ts_ms) = 0
      - missing_count(ts_ns) = 0
      - missing_count(ts_us) = 0
      - count_before_delete = 0:
          name: Validazione before per le operazioni di delete
          count_before_delete query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE
              (op = 'd' AND before.id IS NULL)
              OR
              (op = 'd' AND (
                before.payment_position_id != 0
                OR before.amount != 0
                OR before.description != ''
                OR before.due_date != 0
                OR before.fee != 0
                OR before.inserted_date != 0
                OR before.is_partial_payment != false
                OR before.iuv != ''
                OR before.organization_fiscal_code != ''
                OR before.notification_fee != 0
                ))
      - count_create_read_update_null = 0:
          name: Validazione after per operazioni di create, read, and update
          count_create_read_update_null query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND after.id is NULL
      - unix_timestamp_microseconds_length_due_date = 0:
          name: Validazione lunghezza Unix timestamp in microsecondi due_date
          unix_timestamp_microseconds_length_due_date query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND after.due_date IS NOT NULL AND LENGTH(CAST(after.due_date AS STRING)) != 16
      - unix_timestamp_microseconds_length_inserted_date = 0:
          name: Validazione lunghezza Unix timestamp in microsecondi inserted_date
          unix_timestamp_microseconds_length_inserted_date query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND LENGTH(CAST(after.inserted_date AS STRING)) != 16
      - unix_timestamp_microseconds_length_retention_date = 0:
          name: Validazione lunghezza Unix timestamp in microsecondi retention_date
          unix_timestamp_microseconds_length_retention_date query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND after.retention_date IS NOT NULL AND LENGTH(CAST(after.retention_date AS STRING)) != 16
      - unix_timestamp_microseconds_length_last_updated_date_notification_fee = 0:
          name: Validazione lunghezza Unix timestamp in microsecondi last_updated_date_notification_fee
          unix_timestamp_microseconds_length_last_updated_date_notification_fee query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND after.last_updated_date_notification_fee IS NOT NULL AND LENGTH(CAST(after.last_updated_date_notification_fee AS STRING)) != 16