    topic: gpd-ingestion.apd.payment_option
    format: json

### terms
terms:
  usage: >
    - Gli eventi di delete `d` presentano soltanto la sezione `before`, mentre gli eventi di create `c`, update `u`
      e read `r` prevedono soltanto la sezione `afetr`
    - Gli eventi di delete si riferiscono ad eventi di cancellazione fisica sul database, il campo effettivamente
      valorizzato in caso di delete è `id`, tutti gli altri campi indicati all'interno dello schema vengono inviati
      a blank `""` o zero `0`
    - L'evento è sempre legato ad una ed una sola posizione debitoria (payment-position), il campo payment_position_id
      agisce fa FK sul campo id della payment-position
    - Il campo `last_updated_date_notification_fee` è presente soltanto nella sezione `after` e soltanto in caso di
      update delle spese di notifica da parte di SEND
  limitations: >
    - Nessuna limitazione da segnalare
  noticePeriod: P1M

### models
models:
  payment-option:
    description: Modello utilizzato per rappresentare l'entità `payment-option`
    fields:
      after:
        type: record
        required: false
        description: Sezione che contiente il contenuto dei campi a valle di un'operazione di update o create
        fields:
          id:
            title: Chiave primaria
            type: int
            required: true
            description: Chiave primaria sulla tabella sorgente dell'opzione di pagamento
            example: '260'
            pii: false
          payment_position_id:
            title: FK posizione debitoria
            type: int
            required: true
            description: FK tabella payment-position (in relazione con payment-position.id)
            example: '260'
            pii: false
          amount:
            title: Importo
            type: long
            required: true
            description: Importo opzione di pagamento in euro cents
            example: '30000'
            pii: false
          description:
            title: Descrizione
            type: string
            required: false
            description: Causale opzione di pagamento
            example: "Canone Unico Patrimoniale - SkyLab Inc."
            pii: false
          due_date:
            title: Data scadenza
            type: long
            required: false
            description: Data scadenza opzione di pagamento
            example: "1734103352298000"
            pii: false
          fee:
            title: Commissione
            type: int
            required: false
            description: Commissione applicata in fase di pagamento
            example: "0"
            pii: false
          inserted_date:
            title: Data inserimento
            type: long
            required: true
            description: Data inserimento opzione di pagamento
            example: "1731511352304526"
            pii: false
          is_partial_payment:
            title: Pagamento parziale
            type: boolean
            required: true
            description: Indica se il pagamento è parziale (rata o soluzione unica)
            example: "false"
            pii: false
          iuv:
            title: IUV
            type: string
            required: true
            description: Identificativo univoco opzione di pagamento
            example: "95710187079505567"
            pii: false
          organization_fiscal_code:
            title: Codice fiscale EC
            type: string
            required: true
            description: Codice fiscale ente creditore primario
            example: "77777777777"
            pii: false
          status:
            title: Stato
            type: string
            enum:
              - PO_UNPAID
              - PO_PAID
              - PO_UNREPORTED
              - PO_REPORTED
              - PO_PARTIALLY_REPORTED
            required: true
            description: Stato dell'opzione di pagamento
            example: "PO_PAID"
            pii: false
          retention_date:
            title: Data scadenza estesa
            type: long
            required: false
            description: Data entro la quale, seppur scaduta, l'opzione di pagamento è ancora pagabile
            example: "1739287352298000"
            pii: false
          notification_fee:
            title: Spese di notifica
            type: int
            required: false
            description: Spese di notifica (SEND)
            example: "0"
            pii: false
          last_updated_date_notification_fee:
            title: Ultima modifica spese di notifica
            type: long
            required: false
            description: Data ultima modifica delle spese di notifica (SEND)
            example: "1734250095385581"
            pii: false
      before:
        type: record
        required: false
        description: Sezione che contiente il contenuto dei campi a valle di un'operazione di delete
        fields:
          id:
            title: Chiave primaria
            type: int
            required: true
            description: Chiave primaria sulla tabella sorgente dell'opzione di pagamento
            example: "16"
            pii: false
          payment_position_id:
            title: FK posizione debitoria
            type: int
            required: true
            description: FK tabella payment-position (in relazione con payment-position.id)
            example: "0"
            pii: false
          amount:
            title: Importo
            type: long
            required: true
            description: Importo opzione di pagamento in euro cents
            example: "0"
            pii: false
          description:
            title: Descrizione
            type: string
            required: false
            description: Causale opzione di pagamento
            example: ""
            pii: false
          due_date:
            title: Data scadenza
            type: long
            required: false
            description: Data scadenza opzione di pagamento
            example: "0"
            pii: false
          fee:
            title: Commissione
            type: int
            required: false
            description: Commissione applicata in fase di pagamento
            example: "0"
            pii: false
          inserted_date:
            title: Data inserimento
            type: long
            required: true
            description: Data inserimento opzione di pagamento
            example: "0"
            pii: false
          is_partial_payment:
            title: Pagamento parziale
            type: boolean
            required: true
            description: Indica se il pagamento è parziale (rata o soluzione unica)
            example: "false"
            pii: false
          iuv:
            title: IUV
            type: string
            required: true
            description: Identificativo univoco opzione di pagamento
            example: ""
            pii: false
          organization_fiscal_code:
            title: Codice fiscale EC
            type: string
            required: true
            description: Codice fiscale ente creditore primario
            example: ""
            pii: false
          notification_fee:
            title: Spese di notifica
            type: int
            required: false
            description: Spese di notifica (SEND)
            example: "0"
            pii: false
      op:
        title: Tipo evento
        type: string
        required: true
        enum:
          - r
          - c
          - u
          - d
        description:  Tipo evento (r=read, c=create, u=update, d=delete)
        example: "u"
        pii: false
      ts_ms:
        title: Data ultima modifica in millis local timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731511357267"
        pii: false
      ts_us:
        title: Data ultima modifica in millis US timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731511357267251"
        pii: false
      ts_ns:
        title: Data ultima modifica in nanosecondi local timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731511357267251434"
        pii: false

### schema
schema:
  type: avro
  specification:
    models:
      - payment-option:  |-
          {
            "type": "record",
            "name": "PaymentEvent",
            "fields": [
              {
                "name": "after",
                "type": [
                  "null",
                  {
                    "type": "record",
                    "name": "AfterRecord",
                    "fields": [
                      {"name": "id", "type": "int"},
                      {"name": "payment_position_id", "type": "int"},
                      {"name": "amount", "type": "long"},
                      {"name": "description", "type": ["null", "string"]},
                      {"name": "due_date", "type": ["null", "long"]},
                      {"name": "fee", "type": ["null", "int"]},
                      {"name": "inserted_date", "type": "long"},
                      {"name": "is_partial_payment", "type": "boolean"},
                      {"name": "iuv", "type": "string"},
                      {"name": "organization_fiscal_code", "type": "string"},
                      {"name": "status", "type": "string"},
                      {"name": "retention_date", "type": ["null", "long"]},
                      {"name": "notification_fee", "type": ["null", "int"]},
                      {"name": "last_updated_date_notification_fee", "type": ["null", "long"]}
                    ]
                  }
                ],
                "default": null
              },
              {
                "name": "before",
                "type": [
                  "null",
                  {
                    "type": "record",
                    "name": "BeforeRecord",
                    "fields": [
                      {"name": "id", "type": "int"},
                      {"name": "payment_position_id", "type": "int"},
                      {"name": "amount", "type": "long"},
                      {"name": "description", "type": ["null", "string"]},
                      {"name": "due_date", "type": ["null", "long"]},
                      {"name": "fee", "type": ["null", "int"]},
                      {"name": "inserted_date", "type": "long"},
                      {"name": "is_partial_payment", "type": "boolean"},
                      {"name": "iuv", "type": "string"},
                      {"name": "organization_fiscal_code", "type": "string"},
                      {"name": "notification_fee", "type": ["null", "int"]}
                    ]
                  }
                ],
                "default": null
              },
              {"name": "op", "type": "string"},
              {"name": "ts_ms", "type": "long"},
              {"name": "ts_us", "type": "long"},
              {"name": "ts_ns", "type": "long"}
            ]
          }

