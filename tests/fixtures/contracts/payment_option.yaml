### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields:
      - after.id
      - after.payment_position_id
      - after.amount
      - after.description
      - after.due_date
      - after.fee
      - after.inserted_date
      - after.is_partial_payment
      - after.iuv
      - after.organization_fiscal_code
      - after.retention_date
      - after.notification_fee
      - last_updated_date_notification_fee
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id

quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_option
  xref-dataset:
    - silver_gpd_payment_position
    - silver_gpd_transfer
  specification: |-
    checks for payment-option:

      # ============================================================
      # Entity Level (ent__cmp) -- massivo
      # ============================================================
      - row_count > 0:
          name: ent__cmp__dataset__not_empty

      # ============================================================
      # Completezza Campi Root (fld__cmp) -- incrementale
      # Nota: ${INCREMENTAL_CONDITIONS} non supportato in filter: dei check nativi.
      # ============================================================
      - missing_count(op) = 0:
          name: fld__cmp__op__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ms) = 0:
          name: fld__cmp__ts_ms__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_ns) = 0:
          name: fld__cmp__ts_ns__not_null
          filter: ${INCREMENTAL_CONDITIONS}
      - missing_count(ts_us) = 0:
          name: fld__cmp__ts_us__not_null
          filter: ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Freschezza (fld__tim) -- massivo
      # ============================================================
      - freshness(dl_event_tms) < 1d:
          name: fld__tim__dl_event_tms__freshness_1d

      # ============================================================
      # Completezza Campi After (fld__cmp) -- incrementale
      # ============================================================
      - missing_count(after.id) = 0:
          name: fld__cmp__id__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.payment_position_id) = 0:
          name: fld__cmp__payment_position_id__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.amount) = 0:
          name: fld__cmp__amount__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.inserted_date) = 0:
          name: fld__cmp__inserted_date__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.is_partial_payment) = 0:
          name: fld__cmp__is_partial_payment__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.iuv) = 0:
          name: fld__cmp__iuv__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.organization_fiscal_code) = 0:
          name: fld__cmp__organization_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      - missing_count(after.status) = 0:
          name: fld__cmp__status__not_null
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Enum (fld__vld) -- incrementale
      # ============================================================
      - invalid_count(after.status) = 0:
          name: fld__vld__status__enum
          valid values: ['PO_UNPAID', 'PO_PAID', 'PO_UNREPORTED', 'PO_REPORTED', 'PO_PARTIALLY_REPORTED']
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Pattern P.IVA (fld__vld) -- incrementale
      # vat_format ATTIVO; cf_format DISABILITATO (EC = P.IVA, non CF).
      # ============================================================
      - invalid_count(after.organization_fiscal_code) = 0:
          name: fld__vld__organization_fiscal_code__vat_format
          valid regex: '^[0-9]{11}$'
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}
      # DISABLED: fld__vld__organization_fiscal_code__cf_format

      # ============================================================
      # Validita' - Pattern IUV (fld__vld) -- incrementale
      # ============================================================
      - invalid_count(after.iuv) = 0:
          name: fld__vld__iuv__iuv_format
          valid regex: '^[0-9]+$'
          filter: op IN ('c', 'r', 'u') AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Formato Importi (fld__vld) -- incrementale
      # ============================================================
      - failed rows:
          name: fld__vld__amount__amount_format
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.amount
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.amount IS NOT NULL
              AND after.amount < 0
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__fee__amount_format
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.fee
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.fee IS NOT NULL
              AND after.fee < 0
              AND ${INCREMENTAL_CONDITIONS}

      # ============================================================
      # Validita' - Pattern Causale (fld__vld) -- placeholder TODO
      # ============================================================
      - failed rows:
          name: fld__vld__description__causal_pattern
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.description
            FROM pagopa.silver_gpd_payment_option
            WHERE 1=0 -- TODO: pattern causale non derivabile. Definire con Data Owner.

      # ============================================================
      # Validita' - Lunghezza Timestamp (fld__vld) -- incrementale
      # NB: i check di lunghezza MINIMA (<16) erano DISABLED per PIDM-1751/DLTE-828.
      # ============================================================
      - failed rows:
          name: fld__vld__due_date__timestamp_length
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.due_date
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.due_date IS NOT NULL
              AND LENGTH(CAST(after.due_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__inserted_date__timestamp_length
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.inserted_date
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.inserted_date IS NOT NULL
              AND LENGTH(CAST(after.inserted_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__retention_date__timestamp_length
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.retention_date
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.retention_date IS NOT NULL
              AND LENGTH(CAST(after.retention_date AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__last_update_date_notification_fee__timestamp_length
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.last_updated_date_notification_fee
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.last_updated_date_notification_fee IS NOT NULL
              AND LENGTH(CAST(after.last_updated_date_notification_fee AS STRING)) > 16
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__validity_date__timestamp_length
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code
            FROM pagopa.silver_gpd_payment_option
            WHERE 1=0 -- TODO: after.validity_date ASSENTE nel DDL di payment_option (campo di payment_position)

      # ============================================================
      # Validita' - Intervallo Date <= now() + 30y (fld__vld) -- incrementale
      # ============================================================
      - failed rows:
          name: fld__vld__due_date__date_max_30y
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.due_date
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.due_date IS NOT NULL
              AND from_unixtime(after.due_date / 1000000) > add_months(current_timestamp(), 360)
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__retention_date__date_max_30y
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.retention_date
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.retention_date IS NOT NULL
              AND from_unixtime(after.retention_date / 1000000) > add_months(current_timestamp(), 360)
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: fld__vld__validity_date__date_max_30y
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code
            FROM pagopa.silver_gpd_payment_option
            WHERE 1=0 -- TODO: after.validity_date ASSENTE nel DDL di payment_option

      # ============================================================
      # Consistenza Intra-Entity (ent__cns / ent__cmp) -- incrementale
      # ============================================================
      - failed rows:
          name: ent__cns__delete_event__before_fields_cleared
          fail query: |
            SELECT dl_id, before.id
            FROM pagopa.silver_gpd_payment_option
            WHERE (
                (op = 'd' AND before.id IS NULL)
                OR
                (op = 'd' AND (
                      before.payment_position_id != 0
                      OR before.amount != 0
                      OR before.description != ''
                      OR before.due_date != 0
                      OR before.fee != 0
                      OR before.inserted_date != 0
                      OR before.is_partial_payment != false
                      OR before.iuv != ''
                      OR before.organization_fiscal_code != ''
                      OR before.notification_fee != 0
                ))
              )
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: ent__cmp__after_struct__conditional_presence
          fail query: |
            SELECT dl_id, op, ts_ms
            FROM pagopa.silver_gpd_payment_option
            WHERE (
                (op IN ('c', 'r', 'u') AND after IS NULL)
                OR (op = 'd' AND after IS NOT NULL)
              )
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: ent__cmp__before_struct__conditional_presence
          fail query: |
            SELECT dl_id, op, ts_ms
            FROM pagopa.silver_gpd_payment_option
            WHERE (
                (op = 'd' AND before IS NULL)
                OR (op IN ('c', 'r', 'u') AND before IS NOT NULL)
              )
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: ent__cmp__notification_fee__conditional_presence
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.notification_fee, after.last_updated_date_notification_fee
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.last_updated_date_notification_fee IS NOT NULL
              AND (after.notification_fee IS NULL OR after.notification_fee <= 0)
              AND ${INCREMENTAL_CONDITIONS}
      - failed rows:
          name: ent__cns__fee_status__conditional_value
          fail query: |
            SELECT dl_id, after.iuv, after.organization_fiscal_code, after.fee, after.status
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.fee IS NOT NULL
              AND after.fee > 0
              AND after.status NOT IN ('PO_PAID', 'PO_REPORTED', 'PO_PARTIALLY_REPORTED')
