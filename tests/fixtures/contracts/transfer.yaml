### terms
terms:
  usage: >
    - Gli eventi di delete `d` presentano soltanto la sezione `before`, mentre gli eventi di create `c`, update `u`
      e read `r` prevedono soltanto la sezione `afetr`
    - Gli eventi di delete si riferiscono ad eventi di cancellazione fisica sul database, il campo effettivamente
      valorizzato in caso di delete è `id`, tutti gli altri campi indicati all'interno dello schema vengono inviati
      a blank `""` o zero `0`
    - L'evento è sempre legato ad una ed una sola opzione di pagamento (payment-option), il campo payment_option_id
      agisce fa FK sul campo id della payment-option
  limitations: >
    - Nessuna limitazione da segnalare
  noticePeriod: P1M

### models
models:
  transfer:
    description: Modello utilizzato per rappresentare l'entità `transfer`
    fields:
      after:
        type: record
        required: false
        description: Sezione che contiente il contenuto dei campi a valle di un'operazione di update o create
        fields:
          id:
            title: Chiave primaria
            type: int
            required: true
            description: Chiave primaria sulla tabella sorgente del transfer
            example: "822999"
            pii: false
          payment_option_id:
            title: FK Opzione di pagamento
            type: int
            required: true
            description: FK tabella payment-option (in relazione con payment-position.id)
            example: "805523"
            pii: false
          amount:
            title: Importo
            type: long
            required: true
            description: Importo del transfer in euro cents
            example: "10150"
            pii: false
          category:
            title: Tassonomia pagamento
            type: string
            required: false
            description: Tassonomia del riversamento
            example: "9/0101108TS/"
            pii: false
          transfer_id:
            title: Indice transfer
            type: string
            required: true
            description: indice del transfer all'interno della opzione di pagamento
            example: "1"
            pii: false
          inserted_date:
            title: Data inserimento
            type: long
            required: true
            description: Data inserimento del transfer
            example: "1731515637624188"
            pii: false
          iuv:
            title: IUV
            type: string
            required: true
            description: identificativo univoco dell'opzione di pagamento
            example: "65037958017077450"
            pii: false
          organization_fiscal_code:
            title: Codice fiscale EC
            type: string
            required: true
            description: Codice fiscale ente creditore
            example: "77777777777"
            pii: false
          status:
            title: Stato
            type: string
            enum:
              - T_UNREPORTED
              - T_REPORTED
            required: true
            description: Stato del transfer
            example: "T_UNREPORTED"
            pii: false
      before:
        type: record
        required: false
        description: Sezione che contiente il contenuto dei campi a valle di un'operazione di delete
        fields:
          id:
            title: Chiave primaria
            type: int
            required: true
            description: Chiave primaria sulla tabella sorgente del transfer
            example: "822999"
            pii: false
          payment_option_id:
            title: FK opzione di pagamento
            type: int
            required: true
            description: FK tabella payment-option (in relazione con payment-position.id)
            example: "0"
            pii: false
          amount:
            title: Importo
            type: long
            required: true
            description: Importo del transfer in euro cents
            example: "0"
            pii: false
          category:
            title: Tassonomia
            type: string
            required: false
            description: Tassonomia del riversamento
            example: ""
            pii: false
          transfer_id:
            title: Indice transfer
            type: string
            required: true
            description: indice del transfer all'interno della opzione di pagamento
            example: ""
            pii: false
          inserted_date:
            title: Data inserimento
            type: long
            required: true
            description: Data inserimento del transfer
            example: "0"
            pii: false
          iuv:
            title: IUV
            type: string
            required: true
            description: identificativo univoco dell'opzione di pagamento
            example: ""
            pii: false
          organization_fiscal_code:
            title: Codice fiscale EC
            type: string
            required: true
            description: Codice fiscale ente creditore
            example: ""
            pii: false
      op:
        title: Tipologia evento
        type: string
        required: true
        description: Tipo evento (r=read, c=create, u=update, d=delete)
        example: "u"
        enum:
          - r
          - c
          - u
          - d
        pii: false
      ts_ms:
        title: Data ultima modifica in millis local timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731515641609"
        pii: false
      ts_us:
        title: Data ultima modifica in millis US timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731515641609002"
        pii: false
      ts_ns:
        title: Data ultima modifica in nanosecondi local timezone
        type: long
        required: true
        description: Data ultima modifica evento
        example: "1731515641609002625"
        pii: false

### schema
schema:
  type: avro
  specification:
    models:
      - transfer:  |-
          {
            "type": "record",
            "name": "TransferEvent",
            "fields": [
              {
                "name": "after",
                "type": [
                  "null",
                  {
                    "type": "record",
                    "name": "AfterRecord",
                    "fields": [
                      {"name": "id", "type": "int"},
                      {"name": "amount", "type": "long"},
                      {"name": "category", "type": ["null", "string"]},
                      {"name": "transfer_id", "type": "string"},
                      {"name": "inserted_date", "type": "long"},
                      {"name": "iuv", "type": "string"},
                      {"name": "organization_fiscal_code", "type": "string"},
                      {"name": "payment_option_id", "type": "int"},
                      {"name": "status", "type": "string"}
                    ]
                  }
                ],
                "default": null
              },
              {
                "name": "before",
                "type": [
                  "null",
                  {
                    "type": "record",
                    "name": "BeforeRecord",
                    "fields": [
                      {"name": "id", "type": "int"},
                      {"name": "amount", "type": "long"},
                      {"name": "category", "type": ["null", "string"]},
                      {"name": "transfer_id", "type": "string"},
                      {"name": "inserted_date", "type": "long"},
                      {"name": "iuv", "type": "string"},
                      {"name": "payment_option_id", "type": "int"},
                      {"name": "organization_fiscal_code", "type": "string"}
                    ]
                  }
                ],
                "default": null
              },
              {"name": "op", "type": "string"},
              {"name": "ts_ms", "type": "long"},
              {"name": "ts_us", "type": "long"},
              {"name": "ts_ns", "type": "long"}
            ]
          }

