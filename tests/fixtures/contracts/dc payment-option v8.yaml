### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7 
    percentage: 99.9%
  retention:
    description: si tratta di un dato di configurazioe che dipende dalla tipologia della posizione debitoria, varia da 24h a 1 anno
    unlimited: true
  latency:
    description: Gli eventi di lettura, inserimento, modifica e cancellazione, vengono recepite entro 2 minuti
    threshold: PT1H
  freshness:
    description: I dati vengono importati in modalità near real time
  frequency:
    description: In modo continuo
    type: streaming
    interval: ogni tipologia di modifica
  support:
    description: Disponibile 24/7
    time: 24/7
    responseTime: 30m
  backup:
    description: I dati sono replicati su due region
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "15000000 record/year"
    size: 12GB
  updates:
    fields: 
      - after.id
      - after.payment_position_id
      - after.amount
      - after.description
      - after.due_date
      - after.fee
      - after.inserted_date
      - after.is_partial_payment
      - after.iuv
      - after.organization_fiscal_code
      - after.retention_date
      - after.notification_fee
      - last_updated_date_notification_fee
    lastUpdateField: ts_ms
  deletes:
    mode: hard
    fields:
      - before.id


quality:
  type: SodaCL
  dataset: pagopa.silver_gpd_payment_option
  specification: |-
    checks for payment-option:
      - row_count > 0
      - missing_count(op) = 0
      - missing_count(ts_ms) = 0
      - missing_count(ts_ns) = 0
      - missing_count(ts_us) = 0
      
      - count_create_read_update_null = 0:
          name: Validazione after per operazioni di create, read, and update
          count_create_read_update_null query: |
            SELECT COUNT(*)
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') AND after.id is NULL

      # ============================================================
      # Check not null (Ignoriamo le delete op='d' perché 'after' è null)
      # ============================================================
      - missing_count(after.id) = 0:
          name: fld__vld__id__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.payment_position_id) = 0:
          name: fld__vld__payment_position_id__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.amount) = 0:
          name: fld__vld__amount__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.inserted_date) = 0:
          name: fld__vld__inserted_date__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.is_partial_payment) = 0:
          name: fld__vld__is_partial_payment__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.iuv) = 0:
          name: fld__vld__iuv__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.organization_fiscal_code) = 0:
          name: fld__vld__org_fiscal_code__not_null
          filter: op IN ('c', 'r', 'u')
      - missing_count(after.status) = 0:
          name: fld__vld__status__not_null
          filter: op IN ('c', 'r', 'u')

      # ============================================================
      # Check Pattern Codice Fiscale  (CF persona fisica 16 alfanum. OPPURE 11 cifre)
      # ============================================================
      - invalid_count(after.organization_fiscal_code) = 0:
          name: fld__vld__org_fiscal_code__cf_pattern
          filter: op IN ('c', 'r', 'u')
          valid regex: '^([A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]|[0-9]{11})$'

      # ============================================================
      # Check Lunghezza Timestamp  (max 16 cifre, microsecondi)
      # ============================================================
      - failed rows:
          name: fld__vld__validity_date__ts_length
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.validity_date IS NOT NULL
              AND LENGTH(CAST(after.validity_date AS STRING)) > 16
      - failed rows:
          name: fld__vld__due_date__ts_length
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.due_date IS NOT NULL
              AND LENGTH(CAST(after.due_date AS STRING)) > 16
      - failed rows:
          name: fld__vld__inserted_date__ts_length
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.inserted_date IS NOT NULL
              AND LENGTH(CAST(after.inserted_date AS STRING)) > 16
      - failed rows:
          name: fld__vld__retention_date__ts_length
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.retention_date IS NOT NULL
              AND LENGTH(CAST(after.retention_date AS STRING)) > 16
      - failed rows:
          name: fld__vld__last_upd_notif_fee__ts_length
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.last_updated_date_notification_fee IS NOT NULL
              AND LENGTH(CAST(after.last_updated_date_notification_fee AS STRING)) > 16

      # ============================================================
      # Campo Enum
      # ============================================================
      - invalid_count(after.status) = 0:
          name: fld__vld__status__enum
          filter: op IN ('c', 'r', 'u')
          valid values: ['PO_UNPAID', 'PO_PAID', 'PO_UNREPORTED', 'PO_REPORTED', 'PO_PARTIALLY_REPORTED']

      # ============================================================
      # Check Soglia/Intervallo Date  (data ≤ now() + 30 anni; epoch µs)
      # ============================================================
      - failed rows:
          name: fld__vld__validity_date__date_max_30y
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.validity_date IS NOT NULL
              AND from_unixtime(after.validity_date / 1000000) > add_months(current_timestamp(), 360)
      - failed rows:
          name: fld__vld__due_date__date_max_30y
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.due_date IS NOT NULL
              AND from_unixtime(after.due_date / 1000000) > add_months(current_timestamp(), 360)
      - failed rows:
          name: fld__vld__retention_date__date_max_30y
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE after.retention_date IS NOT NULL
              AND from_unixtime(after.retention_date / 1000000) > add_months(current_timestamp(), 360)

      # ============================================================
      # Check Pattern Numero Avviso / IUV
      # NOTE: il catalogo indica 18 caratteri, le Note indicano 16.
      # TODO: Se IUV può essere 16, 17 o 18, cambia la regex in '^[0-9]{16,18}$'
      # ============================================================
      - invalid_count(after.iuv) = 0:
          name: fld__vld__iuv__iuv_pattern
          filter: op IN ('c', 'r', 'u')
          valid regex: '^[0-9]{16}$'

      # ============================================================
      # Check Pattern Causali
      # ============================================================
      - invalid_count(after.description) = 0:
          name: fld__vld__description__causale_pattern
          filter: op IN ('c', 'r', 'u')
          valid regex: "^[A-Za-z0-9 .,/''-]+$"

      # ============================================================
      # Check importo  (formato eurocent: intero non negativo)
      # ============================================================
      - failed rows:
          name: fld__vld__fee__amount_eurocent
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u') 
              AND after.fee IS NOT NULL
              AND (after.fee < 0 OR after.fee != FLOOR(after.fee))
      - failed rows:
          name: fld__vld__amount__amount_eurocent
          fail query: |
            SELECT *
            FROM pagopa.silver_gpd_payment_option
            WHERE op IN ('c', 'r', 'u')
              AND after.amount IS NOT NULL
              AND (after.amount < 0 OR after.amount != FLOOR(after.amount))