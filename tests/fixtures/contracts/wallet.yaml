### service levels
servicelevels:
  availability:
    description: Il servizio è garantito 24/7. 
    percentage: 99.9%
  retention:
    description: Dati di configurazione, la data di scadenza non è applicabile.
    unlimited: true
  latency:
    description: I dati sono disponibili entro pochi minuti dall'inserimento, dalla modifica o dalla cancellazione.
    threshold: PT1H
  freshness:
    description: I dati vengono importati quasi in tempo reale.
  frequency:
    description: Costantemente
    type: streaming
    interval: every updates
  support:
    description: I dati sono disponibili 24/7.
    time: 24/7
    responseTime: 1h
  backup:
    description: I dati sono replicati in due regioni distinte.
    recoveryTime: 5m
    recoveryPoint: 0m 
  growth:
    rate: "100000 record/year"
    size: 160MB
  updates:
    fields: 
      - walletId
    lastUpdateField: timestamp
  deletes:
    mode: hard
    fields: 
      - walletId

quality:
  type: SodaCL
  dataset: pagopa.silver_wallet
  specification: |-
    checks for wallet:
      - row_count > 0
      - duplicate_count(id) = 0
      - missing_count(id) = 0
      - missing_count(`timestamp`) = 0
      - missing_count(type) = 0
      - missing_count(walletId) = 0
      - count_double_wallet_id = 0:
          name: Controllo singolo walletid in tabella gold
          count_double_wallet_id query: |
            SELECT
                COUNT(*)
            FROM (
                SELECT
                    walletid
                FROM
                    pagopa.gold_wallet
                GROUP BY
                    walletid
                HAVING
                    COUNT(*) > 1
            ) AS duplicates
      - count_bronze_silver = 0:
          name: Controllo count bronze silver
          count_bronze_silver query: |
            SELECT
                CASE
                    WHEN silver_count = bronze_count THEN 0
                    ELSE 1
                END AS result
            FROM (
                SELECT
                    COUNT(*) AS silver_count
                FROM pagopa.silver_wallet
                WHERE dl_event_tms < CAST(CAST(DATE_SUB(NOW(), 1) AS STRING) AS TIMESTAMP)
            ) silver,
            (
                SELECT
                    COUNT(DISTINCT id) AS bronze_count
                FROM pagopa.bronze_wallet
                WHERE dl_event_tms < CAST(CAST(DATE_SUB(NOW(), 1) AS STRING) AS TIMESTAMP)
            ) bronze
      - count_audit_wallet_null = 0:
          name: Controllo campi audit wallet not null
          count_audit_wallet_null query: |
            SELECT COUNT(*)
            FROM pagopa.bronze_wallet
            WHERE type = 'WalletOnboardCompletedEvent'
              AND (
                auditwallet.paymentMethodId IS NULL
                OR auditwallet.creationDate IS NULL
                OR auditwallet.updateDate IS NULL
                OR auditwallet.details.type IS NULL
                OR auditwallet.status IS NULL
              )
      - count_audit_wallet_applications_null = 0:
          name: Controllo campi audit wallet applications not null
          count_audit_wallet_applications_null query: |
            SELECT COUNT(*)
            FROM pagopa.bronze_wallet t
            LEFT JOIN t.auditWallet.applications awa
            WHERE type = 'WalletOnboardCompletedEvent'
            AND (
              awa._id IS NULL
              OR awa.status IS NULL
              OR awa.creationDAte IS NULL
              OR awa.updateDate IS NULL
            )