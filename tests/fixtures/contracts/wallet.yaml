dataContractSpecification: 0.9.3
id: urn:pagopa:ecommerce:wallet
info:
  title: Wallet Contract
  version: 0.0.1
  description: Definire l'oggetto per rappresentare il wallet dell'utente.
  owner: pagoPA QA-Team
  contact:
    name: Andrea Ferracci (Data Owner)
    url: https://pagopa.atlassian.net/wiki/spaces/I/pages/910000520/Design+Review+-+Wallet
    email: andrea.ferracci@pagopa.it
    slack-channel: https://pagopaspa.slack.com/archives/C015HN4UZAM
### servers
servers:
  uat:
    type: kafka
    host: sb://pagopa-u-itn-observ-evh.servicebus.windows.net
    topic: payment-wallet-ingestion-dl
    format: json
  production:
    type: kafka
    host: sb://pagopa-p-weu-observ-evh.servicebus.windows.net
    topic: payment-wallet-ingestion-dl
    format: json

### terms
terms:
  usage: >
    - GLi eventi di update sono relativi esclusivamente alle applicazioni abilitate (es. PAGOPA), infatti gli unici dati che l'utente può
      modificare sono quelli relativi al'abilitazione/disabilitazione del wallet per una determinata applicazione. 
    - Quando viene ricevuto un evento WalletApplicationsUpdatedEvent con il campo updatedApplications valorizzato, 
      verrà effettuato un overwrite su auditWallet.applications con lo stesso walletId.
  limitations: >
    - Lo stato del wallet non corrisponde allo stato del metodo di pagamento a cui fa riferimento, ad esempio se una carta di credio giunge
      a scadenza, il wallet collegato non cambierà automaticamente stato.
  noticePeriod: P1M

### models
models:
  wallet:
    description: Oggetto che rappresenta l'entità wallet
    fields:
      id:
        title: id
        pii: false
        type: string
        required: true
        description: Identificativo univoco dell'evento
        classification: public
        example: "193e2ec5-ac66-41d5-99c0-415621e92d05" 
      timestamp:
        title: timestamp
        pii: false
        type: string
        required: true
        description: Data ultima modifica dell'evento
        classification: public
        example: "2024-10-28T09:20:49.076091947Z" 
      type:
        title: type
        pii: false      
        type: string
        required: true
        enum:
          - WalletOnboardCompletedEvent
          - WalletApplicationsUpdatedEvent
          - WalletDeletedEvent
          - WalletOnboardReplacedEvent
        description: tipologia di evento (ripettivamnte Onboarding, update, delete e sostituzione carta scaduta)
        classification: public
        example: "WalletOnboardCompletedEvent" 
      walletId:
        title: walletId
        pii: false      
        type: string
        required: true
        description: Identificativo univoco del wallet
        classification: public
        example: "5be2080b-69a2-4875-91dc-185891dfe9f5" 
      auditWallet:
        title: auditWallet
        pii: false      
        type: object
        required: false
        description: Dati del wallet, sezione presente soltanto per l'evento di onboarding WalletOnboardCompletedEvent e l'evento di aggiornamento carta scaduta WalletOnboardReplacedEvent
        classification: public 
        fields:
          paymentMethodId:
            title: paymentMethodId
            pii: false
            type: string
            required: false
            description: Identificativo univoco del metodo di pagamento (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public
            example: "0d1450f4-b993-4f89-af5a-1770a45f5d71" 
          creationDate:
            title: creationDate
            pii: false          
            type: string
            required: false
            description: Data di creazione dell'evento (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public
            example: "2024-10-28T09:19:58.512332825Z" 
          updateDate:
            title: updateDate
            pii: false          
            type: string
            required: false
            description: Data ultima modifica del wallet (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public
            example: "2024-10-28T09:20:49.050160654Z" 
          applications:
            title: applications
            pii: false          
            type: array
            required: false
            description: Applicazione su cui il wallet è stato abilitato/disabilitato (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public 
            items:
              type: object
              fields:
                _id:
                  title: _id
                  pii: false                          
                  type: string
                  required: true
                  description: Identificativo dell'applicazione, es. PAGOPA
                  classification: public
                  example: "PAGOPA" 
                status:
                  title: status
                  pii: false                          
                  type: string
                  required: true
                  enum:
                    - ENABLED
                    - DISABLED
                  description: Stato del wallet per l'applicazione
                  classification: public
                  example: "ENABLED" 
                creationDate:
                  title: creationDate
                  pii: false                          
                  type: string
                  required: true
                  description: Data di associazione all'applicazione
                  classification: public
                  example: "2024-10-28T09:19:58.395302808Z" 
                updateDate:
                  title: updateDate
                  pii: false                          
                  type: string
                  required: true
                  description: Data ultima modifica dell'associazione
                  classification: public
                  example: "2024-10-28T09:19:58.395303146Z" 
          details:
            title: details
            pii: false  
            type: object
            required: false
            description: Dettagli del wallet (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public 
            fields:
              type:
                title: type
                pii: false  
                type: string
                required: true
                description: Tipologia del metodo di pagamento, es. CARD, PAYPAL ...
                classification: public
                example: "PAYPAL" 
              cardBrand:
                title: cardBrand
                pii: false  
                type: string
                required: false
                description: Brand del metodo di pagamento, valido solo per la tipologia CARD
                classification: public 
              pspId:
                title: pspId
                pii: false  
                type: string
                required: false
                description: Id del PSP con cui è stato eseguito l'onboarding
                classification: public
                example: "BCITITMM" 
          status:
            title: status
            pii: false 
            type: string
            required: false
            description: Stato del wallet, es. VALIDATED (campo presente e obbligatorio soltanto per l'evento di onboarding WalletOnboardCompletedEvent)
            classification: public
            example: "VALIDATED" 
          validationOperationId:
            title: validationOperationId
            pii: false 
            type: string
            required: false
            description: Identificativo dell'operazione NPG con cui è stato eseguito l'onboarding
            classification: public
            example: "572632648066943029" 
          validationOperationResult:
            title: validationOperationResult
            pii: false 
            type: string
            required: false
            description: Risultato della validazione lato NPG
            classification: public
            example: "EXECUTED" 
          validationOperationTimestamp:
            title: validationOperationTimestamp
            pii: false 
            type: string
            required: false
            description: Timestamp della validazione lato NPG
            classification: public
            example: "2024-10-28T09:20:48.610Z"
          validationErrorCode:
            title: validationErrorCode
            pii: false 
            type: string
            required: false
            description: Campo che riporta, in caso di errore di validazione lato NPG, il relativo codice
            classification: public
            example: "ABC123"
      updatedApplications:
        title: updatedApplications
        pii: false 
        type: array
        required: false
        description: Dati modificati relativi alle applicazioni, sezine presente soltanto per gli eventi di update
        classification: public 
        items:
          type: object
          fields:
            _id:
              title: updatedApplications
              pii: false 
              type: string
              required: true
              description: Identificativo del'applicazione, es. PAGOPA
              classification: public
              example: "PAGOPA" 
            status:
              title: status
              pii: false 
              type: string
              required: true
              enum:
                - ENABLED
                - DISABLED
              description: Stato del wallet per l'applicazione
              classification: public 
              example: "ENABLED"
            creationDate:
              title: creationDate
              pii: false 
              type: string
              required: true
              description: Data creazione dell'applicazione
              classification: public
              example: "2024-10-28T09:19:58.395302808Z" 
            updateDate:
              title: updateDate
              pii: false 
              type: string
              required: true
              description: Data ultima modifica dell'applicazioen
              classification: public
              example: "2024-10-28T09:21:01.197445280Z" 

