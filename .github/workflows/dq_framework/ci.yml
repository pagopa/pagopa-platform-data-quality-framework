name: CI — Build & Lint

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze di build
        run: pip install build ruff

      - name: Lint
        run: ruff check .

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dq-framework-whl
          path: dist/*.whl
          retention-days: 7
