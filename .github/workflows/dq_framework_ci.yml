name: CI — Build & Lint

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    # Runner self-hosted CodeBuild (progetto pagopa-platform-data-quality-framework-runner,
    # account 407424444552, eu-south-1). run_id e run_attempt nel label sono obbligatori:
    # è così che CodeBuild lega il runner effimero alla singola esecuzione del job.
    runs-on:
      - codebuild-pagopa-platform-data-quality-framework-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze di build
        run: pip install build ruff

      - name: Lint
        run: ruff check .

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dq-framework-whl
          path: dist/*.whl
          retention-days: 7
