name: CD — Deploy su CDE

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi "yes" per confermare il deploy'
        required: true
        default: ''

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'yes')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calcola suffisso ambiente
        id: suffix
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=" >> $GITHUB_OUTPUT
          else
            echo "value=-test" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Installa CDE CLI (se non disponibile)
        run: |
          if command -v cde &>/dev/null; then
            echo "CDE CLI già presente: $(cde --version)"
          else
            echo "CDE CLI non trovato, scarico da ${{ vars.CDE_CLI_DOWNLOAD_URL }}"
            curl -L --max-time 30 -o cde "${{ vars.CDE_CLI_DOWNLOAD_URL }}"
            chmod +x cde
            sudo mv cde /usr/local/bin/cde
            echo "CDE CLI installato: $(cde --version)"
          fi

      - name: Configura CDE CLI
        run: |
          mkdir -p ~/.cdp
          cat > ~/.cdp/credentials <<EOF
          [default]
          cdp_access_key_id = ${{ secrets.CDP_ACCESS_KEY_ID }}
          cdp_private_key = ${{ secrets.CDP_PRIVATE_KEY }}
          EOF

      - name: Crea risorsa CDE (se non esiste)
        run: |
          RESOURCE_NAME="dq-framework${{ steps.suffix.outputs.value }}"
          cde resource describe --name "$RESOURCE_NAME" \
            --vcluster-endpoint "${{ secrets.CDE_CLUSTER_URL }}" 2>/dev/null \
            || cde resource create --name "$RESOURCE_NAME" --type files \
              --vcluster-endpoint "${{ secrets.CDE_CLUSTER_URL }}"

      - name: Upload wheel e launcher su CDE
        run: |
          RESOURCE_NAME="dq-framework${{ steps.suffix.outputs.value }}"
          cde resource upload \
            --name "$RESOURCE_NAME" \
            --local-path "$(ls dist/*.whl)" \
            --vcluster-endpoint "${{ secrets.CDE_CLUSTER_URL }}"
          cde resource upload \
            --name "$RESOURCE_NAME" \
            --local-path launcher.py \
            --vcluster-endpoint "${{ secrets.CDE_CLUSTER_URL }}"

      - name: Crea o aggiorna job CDE
        run: |
          RESOURCE_NAME="dq-framework${{ steps.suffix.outputs.value }}"
          JOB_NAME="dq-quality${{ steps.suffix.outputs.value }}"
          WHL_NAME="$(basename dist/*.whl)"
          ENDPOINT="${{ secrets.CDE_CLUSTER_URL }}"

          if cde job describe --name "$JOB_NAME" --vcluster-endpoint "$ENDPOINT" 2>/dev/null; then
            cde job update \
              --name "$JOB_NAME" \
              --application-file launcher.py \
              --spark-flag "--py-files=$WHL_NAME" \
              --mount-1-resource "$RESOURCE_NAME" \
              --vcluster-endpoint "$ENDPOINT"
          else
            cde job create \
              --name "$JOB_NAME" \
              --type spark \
              --application-file launcher.py \
              --spark-flag "--py-files=$WHL_NAME" \
              --mount-1-resource "$RESOURCE_NAME" \
              --env ENV=prod \
              --env GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              --env SODA_API_KEY="${{ secrets.SODA_API_KEY }}" \
              --env SODA_API_SECRET="${{ secrets.SODA_API_SECRET }}" \
              --vcluster-endpoint "$ENDPOINT"
          fi

      - name: Riepilogo deploy
        run: |
          SUFFIX="${{ steps.suffix.outputs.value }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Risorsa : dq-framework${SUFFIX}"
          echo "Job     : dq-quality${SUFFIX}"
          echo "Wheel   : $(basename dist/*.whl)"
