name: Smoke test — runner CodeBuild

# Workflow minimale per verificare che il runner self-hosted CodeBuild
# si registri correttamente ed esegua i job. Nessun build né deploy:
# solo un "hello world" con qualche informazione diagnostica sul runner.
# Da rimuovere una volta che il runner è validato e la CI/CD è migrata.
on:
  push:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on:
      - codebuild-pagopa-platform-data-quality-framework-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Hello + info runner
        run: |
          echo "Hello World dal runner CodeBuild"
          echo "Utente : $(whoami)"
          echo "Host   : $(uname -a)"
          echo "PWD    : $(pwd)"

      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Verifica contenuto del repo
        run: ls -la
